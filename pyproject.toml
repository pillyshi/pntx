[project]
name = "pntx"
version = "0.1.0"
description = "Generate and classify text from user-defined (positive, negative) example pairs"
readme = "README.md"
authors = [
    { name = "pillyshi", email = "pillyshi21@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llama = [
    "llama-cpp-python",
]
anthropic = ["anthropic"]
embeddings = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
]
