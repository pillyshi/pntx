[project]
name = "pntx"
version = "0.6.1"
description = "Generate and classify text from user-defined positive/negative example pools"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "pillyshi", email = "pillyshi21@gmail.com" }
]
requires-python = ">=3.10"
keywords = [
    "nlp",
    "llm",
    "llama.cpp",
    "text-generation",
    "text-classification",
    "few-shot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = [
    "scikit-learn>=1.6",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/pillyshi/pntx"
Repository = "https://github.com/pillyshi/pntx"
Issues = "https://github.com/pillyshi/pntx/issues"

[project.optional-dependencies]
llama = [
    "llama-cpp-python",
]
anthropic = [
    "anthropic",
]
embeddings = [
    "sentence-transformers",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "datasets.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tqdm.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "twine>=6.2.0",
]
benchmark = [
    "datasets",
]
